name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
    paths-ignore:
      - "helm/**"
      - "README.md"
      - "Jenkinsfile"
      - "deployment-service.yaml"

jobs:
  checkout_and_setup:
    name: Checkout and Setup Environment
    runs-on: self-hosted
    outputs:
      docker_image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set Docker Image Tag
        id: set_tag
        run: echo "image_tag=${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.run_id }}" >> $GITHUB_OUTPUT

  build:
    name: Build Application
    needs: checkout_and_setup
    runs-on: self-hosted
    steps:
      - name: Build with Maven
        run: |
            echo "skip"
  trivy_scan_fs:
    name: Trivy File System Scan
    needs: build
    runs-on: self-hosted
    steps:
      - name: Run Trivy scanner without cache
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          cache: 'false'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sonarqube_scan:
    name: SonarQube Analysis
    needs: trivy_scan_fs
    runs-on: self-hosted
    steps:
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sonarqube_quality_gate:
    name: SonarQube Quality Gate Check
    needs: sonarqube_scan
    runs-on: self-hosted
    steps:
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build_docker_image:
    name: Build Docker Image
    needs: sonarqube_quality_gate
    runs-on: self-hosted
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.run_id }} .

  trivy_scan_image:
    name: Trivy Image Scan
    needs: build_docker_image
    runs-on: self-hosted
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.run_id }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  push_docker_image:
    name: Push Docker Image
    needs: trivy_scan_image
    runs-on: self-hosted
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push action
        uses: docker/build-push-action@v6 
        with:
              context: .
              file: ./Dockerfile
              platforms: linux/AMD64
              push: true
              tags: ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{github.run_id}}

  # run_docker_container:
